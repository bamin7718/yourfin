name: Build and Release APK

# Hai chế độ:
#   · push lên main  → build để biết native còn dựng được, chỉ để artifact
#   · gắn tag v*     → build và PHÁT HÀNH, đây mới là thứ app kiểm tra cập nhật
#
# Release phải mang số phiên bản chứ không phải tag cố định `latest`:
# checkAppUpdate() đọc tag_name rồi so với APP_VERSION, mà "latest" thì không
# so với "5.0.0" được.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # cần để tạo/cập nhật Release

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, không phải 20: @capacitor/cli đặt engines.node ">=22.0.0" và
      # `cap add` bỏ cuộc ngay trên Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 dựng bằng AGP 8.13 và đặt sourceCompatibility = 21.
      # Java 17 sẽ fail ngay ở bước Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Tag phải khớp version trong package.json, nếu không app vừa cập nhật
      # xong đã tự thấy mình lỗi thời. Chặn ngay đây, trước khi tốn build.
      - name: Đối chiếu tag với package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::Tag $GITHUB_REF_NAME khong khop version $PKG trong package.json"; exit 1; }

      - run: npm ci

      # Cùng một cổng chặn với web: không đóng gói một bản mà bản web sẽ bị
      # chặn không cho deploy.
      - name: Kiểm thử
        run: npm test

      # Thiếu bước này thì APK ra lò không có khoá Supabase và mở lên chỉ thấy
      # màn hình cấu hình. --strict để hỏng thì hỏng ở đây, không phải trên máy
      # người dùng.
      - name: Sinh cấu hình
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/generate-env.js --strict

      # android/ không nằm trong repo (xem .gitignore) — sinh mới mỗi lần build
      # nên không có dự án native nào lệch khỏi public/. `cap sync` một mình sẽ
      # lỗi vì chưa có thư mục để mà sync.
      - name: Dựng dự án Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      # "app-debug.apk" trông đáng ngờ khi tải về điện thoại. Tên này phải khớp
      # với APK_URL trong public/js/app.js — có assertion khoá lại cặp đó.
      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sofin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sofin-apk
          path: sofin.apk
          retention-days: 30

      # Chỉ khi có tag. Nút Tải App trỏ vào /releases/latest/download/sofin.apk
      # — bí danh của GitHub cho bản phát hành mới nhất — nên link không đổi
      # dù số phiên bản đổi.
      - name: Phát hành
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SoFin ${{ github.ref_name }}
          body: |
            Bản Android dựng tự động từ `${{ github.sha }}`.

            APK ký **debug**: Android sẽ hỏi xác nhận vì cài ngoài Play Store, và
            không nâng cấp đè lên bản ký bằng khoá khác được.
          draft: false
          prerelease: false
          files: sofin.apk
