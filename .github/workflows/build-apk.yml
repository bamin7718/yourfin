name: Build and Release APK

# Hai chế độ:
#   · push lên main  → build để biết native còn dựng được, chỉ để artifact
#   · gắn tag v*     → build và PHÁT HÀNH, đây mới là thứ app kiểm tra cập nhật
#
# Release phải mang số phiên bản chứ không phải tag cố định `latest`:
# checkAppUpdate() đọc tag_name rồi so với APP_VERSION, mà "latest" thì không
# so với "5.0.0" được.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # cần để tạo/cập nhật Release

# Nhóm theo REF, không phải một nhóm "apk" duy nhất. `git push origin main v5.0.2`
# đẩy cả nhánh lẫn tag một lượt → hai run cùng lúc; với một nhóm chung thì cái
# chạy sau giết cái chạy trước, và đã có lần cái bị giết chính là run của tag —
# tag lên nhưng KHÔNG có release nào được tạo, im lặng hoàn toàn.
# Theo ref thì mỗi ref chỉ huỷ run cũ của chính nó.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, không phải 20: @capacitor/cli đặt engines.node ">=22.0.0" và
      # `cap add` bỏ cuộc ngay trên Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 dựng bằng AGP 8.13 và đặt sourceCompatibility = 21.
      # Java 17 sẽ fail ngay ở bước Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Tag phải khớp version trong package.json, nếu không app vừa cập nhật
      # xong đã tự thấy mình lỗi thời. Chặn ngay đây, trước khi tốn build.
      - name: Đối chiếu tag với package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::Tag $GITHUB_REF_NAME khong khop version $PKG trong package.json"; exit 1; }

      - run: npm ci

      # Cùng một cổng chặn với web: không đóng gói một bản mà bản web sẽ bị
      # chặn không cho deploy.
      - name: Kiểm thử
        run: npm test

      # Thiếu bước này thì APK ra lò không có khoá Supabase và mở lên chỉ thấy
      # màn hình cấu hình. --strict để hỏng thì hỏng ở đây, không phải trên máy
      # người dùng.
      - name: Sinh cấu hình
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/generate-env.js --strict

      # android/ không nằm trong repo (xem .gitignore) — sinh mới mỗi lần build
      # nên không có dự án native nào lệch khỏi public/. `cap sync` một mình sẽ
      # lỗi vì chưa có thư mục để mà sync.
      - name: Dựng dự án Android
        run: |
          npx cap add android
          npx cap sync android

      # KHOÁ KÝ CỐ ĐỊNH — bước này là thứ quyết định app có cài đè được không.
      # Runner là máy sạch, không có ~/.android/debug.keystore, nên Gradle tự
      # sinh một khoá NGẪU NHIÊN mới cho mỗi lần build. Android từ chối cài đè
      # khi chữ ký khác nhau (INSTALL_FAILED_UPDATE_INCOMPATIBLE), nên mỗi bản
      # phát hành lại bắt người dùng gỡ app — và gỡ app là xoá sạch localStorage.
      # Khoá phải đúng alias/mật khẩu mặc định của debug thì signingConfig sẵn
      # có của Gradle mới dùng được: androiddebugkey / android / android.
      - name: Khoá ký cố định
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
              echo "::error::Thiếu secret ANDROID_DEBUG_KEYSTORE_B64. Phát hành mà không có khoá cố định thì bản này KHÔNG cài đè được lên bản trước."
              exit 1
            fi
            echo "::warning::Chưa có ANDROID_DEBUG_KEYSTORE_B64 — artifact này ký bằng khoá ngẫu nhiên, không cài đè được."
          else
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Đã nạp khoá ký cố định."
          fi

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      # "app-debug.apk" trông đáng ngờ khi tải về điện thoại. Tên này phải khớp
      # với APK_URL trong public/js/app.js — có assertion khoá lại cặp đó.
      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sofin.apk

      # Đối chiếu chữ ký của APK vừa dựng với vân tay đã biết. Bước "Khoá ký cố
      # định" ở trên chỉ chắc rằng FILE khoá tồn tại — nó không chứng minh Gradle
      # đã dùng đúng file đó. Mà sai chữ ký thì hỏng lặng lẽ: APK cài được, chạy
      # được, chỉ là không ai nâng cấp đè lên nó được, và chỉ phát hiện ra khi
      # người dùng thử cập nhật. Vân tay chứng chỉ không phải bí mật — nó nằm sẵn
      # trong mọi APK đã phát hành.
      - name: Đối chiếu chữ ký
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs sofin.apk \
            | grep -i 'SHA-256 digest' | head -1 | tr -d ' ' | cut -d: -f2 | tr 'A-F' 'a-f')
          WANT=f73a128dce734c3d0b68107598cb41bf5d7d030a645dc42b2d3ad845ac920017
          echo "signer=$GOT"
          test "$GOT" = "$WANT" || { echo "::error::APK ký bằng khoá LẠ ($GOT). Bản này sẽ không cài đè được lên bản trước."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sofin-apk
          path: sofin.apk
          retention-days: 30

      # Chỉ khi có tag. Nút Tải App trỏ vào /releases/latest/download/sofin.apk
      # — bí danh của GitHub cho bản phát hành mới nhất — nên link không đổi
      # dù số phiên bản đổi.
      - name: Phát hành
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SoFin ${{ github.ref_name }}
          body: |
            Bản Android dựng tự động từ `${{ github.sha }}`.

            APK ký **debug**: Android sẽ hỏi xác nhận vì cài ngoài Play Store, và
            không nâng cấp đè lên bản ký bằng khoá khác được.
          draft: false
          prerelease: false
          files: sofin.apk
